[package]
name = "altkey"
version = "0.1.0"
edition = "2021"
description = "altkey backend engine — turns AI subscriptions into an OpenAI-compatible API key"
license = "MIT OR Apache-2.0"

[lib]
name = "altkey"
path = "src/lib.rs"

[[bin]]
name = "altkey"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["json", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "http1"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
bytes = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
url = "2"
dirs = "5"
once_cell = "1"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
async-stream = "0.3"
rcgen = { version = "0.13", features = ["x509-parser"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
tunnel-proto = { path = "../tunnel-proto" }
altkey-api = { path = "../altkey-api" }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
