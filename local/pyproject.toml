[project]
name = "altkey"
version = "0.1.0"
description = "Local proxy that turns AI subscriptions into OpenAI-compatible API keys"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx[http2]>=0.27",
    "cryptography>=43",
    "keyring>=25",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
